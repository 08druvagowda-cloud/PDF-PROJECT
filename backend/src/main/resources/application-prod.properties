# ===========================================================================
# PRODUCTION Profile  (activated via SPRING_PROFILES_ACTIVE=prod)
# All sensitive values are read from environment variables so no code changes
# are required between development and production.
# ===========================================================================

# Railway / Render / Docker inject DATABASE_URL in the format:
#   jdbc:mysql://<host>:<port>/<db>?useSSL=true&serverTimezone=UTC
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Railway / Render inject PORT automatically; default to 8080
server.port=${PORT:8080}

# PDF storage inside the container (ephemeral — stored alongside the JAR)
pdf.storage.dir=${PDF_STORAGE_DIR:/app/generated_pdfs}
