spring.application.name=backend

# ===========================================================================
# DEFAULT / DEVELOPMENT Profile
# When running locally with ./mvnw spring-boot:run, these settings are used.
# For production, set SPRING_PROFILES_ACTIVE=prod to use application-prod.properties
# ===========================================================================

# Local MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/docgen?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=docgen_user
spring.datasource.password=password123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dev: run on 8081 so React dev server (5173) can proxy to it
server.port=8081

# PDF storage — relative to the working directory by default
pdf.storage.dir=./generated_pdfs
